name: check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # an exact version skips the GitHub API lookup, which rate-limits the runner
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc
      - run: bun test
